<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect with OH Stripe on social media.">
    <title>OH Stripe | Social Media</title>

    <style>
        :root {
            --scarlet: #d12f45;
            --black: #151515;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--black);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            color: var(--white);
            background: var(--black);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            position: relative;
            display: grid;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            place-items: center;
            isolation: isolate;
        }

        main::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            background: rgba(0, 0, 0, .44);
            content: "";
            pointer-events: none;
        }

        .background-video {
            position: absolute;
            z-index: -2;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .contact {
            width: 100%;
            padding: 70px clamp(24px, 6vw, 80px);
        }

        .contact-inner {
            display: grid;
            justify-items: center;
            gap: 28px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            padding: 32px 28px;
            border: 3px solid var(--scarlet);
            border-radius: 18px;
            background: rgba(21, 21, 21, .78);
            box-shadow: 0 18px 45px rgba(0, 0, 0, .4);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
        }

        .section-heading {
            max-width: 680px;
            text-align: center;
        }

        .section-heading h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.6rem);
            letter-spacing: -.04em;
        }

        .contact-actions {
            display: grid;
            gap: 12px;
            width: min(100%, 420px);
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 56px;
            padding: 13px 20px;
            border: 2px solid var(--white);
            border-radius: 999px;
            color: var(--white);
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .social-button:hover,
        .social-button:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 rgba(209, 47, 69, .95);
            outline: none;
        }

        .facebook-button {
            background: #1877f2;
        }

        .instagram-button {
            background: linear-gradient(135deg, #833ab4, #e1306c 55%, #f77737);
        }

        .linkedin-button {
            background: #0a66c2;
        }

        .website-button {
            background: var(--scarlet);
        }

        .social-icon {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .business-name {
            margin: -4px 0 0;
            font-size: .95rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-align: center;
        }

        @media (max-width: 760px) {
            .contact-inner {
                padding: 24px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .social-button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <video class="background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="assets/background.mp4" type="video/mp4">
        </video>

        <section class="contact" aria-labelledby="contact-title">
            <div class="contact-inner">
                <div class="section-heading">
                    <h1 id="contact-title">Reach Us on Social Media or Get in touch with us</h1>
                </div>

                <div class="contact-actions">
                    <a class="social-button facebook-button" href="https://www.facebook.com/ohstripe/" target="_blank" rel="noopener noreferrer">
                        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.49-3.91 3.77-3.91 1.09 0 2.23.2 2.23.2v2.47h-1.25c-1.24 0-1.63.77-1.63 1.56v1.89h2.77l-.44 2.91h-2.33V22C18.34 21.24 22 17.08 22 12.06Z"/>
                        </svg>
                        <span>Visit Our Facebook</span>
                    </a>

                    <a class="social-button instagram-button" href="https://www.instagram.com/ohstripe/" target="_blank" rel="noopener noreferrer">
                        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
                        </svg>
                        <span>Check Us Out on Instagram</span>
                    </a>

                    <a class="social-button linkedin-button" href="https://www.linkedin.com/company/oh-stripe/" target="_blank" rel="noopener noreferrer">
                        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 0 1 5.34 3.5ZM3.32 9.93h4.04V22H3.32V9.93Zm6.55 0h3.88v1.65h.06c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V22h-4.04v-5.59c0-1.33-.03-3.05-1.86-3.05-1.86 0-2.15 1.45-2.15 2.95V22h-4.04V9.93Z"/>
                        </svg>
                        <span>Find Us on LinkedIn</span>
                    </a>

                    <a class="social-button website-button" href="index.html">
                        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.92 6h-3.04a15.7 15.7 0 0 0-1.42-3.26A8.05 8.05 0 0 1 18.92 8ZM12 4c.83 1.01 1.5 2.36 1.87 4h-3.74C10.5 6.36 11.17 5.01 12 4ZM4.26 14a7.75 7.75 0 0 1 0-4h3.39a16.72 16.72 0 0 0 0 4H4.26Zm.82 2h3.04c.31 1.2.78 2.3 1.42 3.26A8.05 8.05 0 0 1 5.08 16ZM8.12 8H5.08a8.05 8.05 0 0 1 4.46-3.26A15.7 15.7 0 0 0 8.12 8ZM12 20c-.83-1.01-1.5-2.36-1.87-4h3.74c-.37 1.64-1.04 2.99-1.87 4Zm2.22-6H9.78a14.18 14.18 0 0 1 0-4h4.44a14.18 14.18 0 0 1 0 4Zm.24 5.26A15.7 15.7 0 0 0 15.88 16h3.04a8.05 8.05 0 0 1-4.46 3.26ZM16.35 14a16.72 16.72 0 0 0 0-4h3.39a7.75 7.75 0 0 1 0 4h-3.39Z"/>
                        </svg>
                        <span>Check Out Our Website</span>
                    </a>
                </div>

                <p class="business-name">OH STRIPE LLC</p>
            </div>
        </section>
    </main>

</body>
</html>
